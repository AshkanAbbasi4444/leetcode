<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Max Product Difference</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --table:#E8EEF2;--surface:#FFFFFF;--line:#CBD5DE;--ink:#1E2A36;--muted:#5F6F7E;
  --hi:#2346C8;--hi-pale:#DCE4FB;--lo:#C8323C;--lo-pale:#F9DEDF;
  --new:#F2B807;--new-pale:#FFF3C4;--move:#A77800;--tile:#FFFDF7;--tile-edge:#D5DCE3;--tile-base:#BCC6D0;
  --code-dim:#7D8A97;--code-n:#AEB9C3;--code-run:#EEF2F6;--th-bg:#F4F7F9;--panel:#F7F9FB;--on-ink:#FFFFFF;
  --tick:#C9D3DC;--tick-hi:#B9C6EE;--tick-lo:#EDC1C4;
  --z:1;color-scheme:light;
  --sans:"Bricolage Grotesque",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--table:#11161B;--surface:#1A2129;--line:#2F3943;--ink:#E7EDF2;--muted:#95A3B0;
  --hi:#86A2FF;--hi-pale:#1D2950;--lo:#FF808A;--lo-pale:#471E25;
  --new:#F2B807;--new-pale:#3A2F10;--move:#E5B84A;--tile:#232C36;--tile-edge:#3A4652;--tile-base:#0B0F13;
  --code-dim:#6E7C89;--code-n:#4C5864;--code-run:#222C37;--th-bg:#202831;--panel:#1F272F;--on-ink:#11161B;
  --tick:#34404B;--tick-hi:#2D3B6C;--tick-lo:#5A2A31;color-scheme:dark}}
:root[data-theme="dark"]{--table:#11161B;--surface:#1A2129;--line:#2F3943;--ink:#E7EDF2;--muted:#95A3B0;
  --hi:#86A2FF;--hi-pale:#1D2950;--lo:#FF808A;--lo-pale:#471E25;
  --new:#F2B807;--new-pale:#3A2F10;--move:#E5B84A;--tile:#232C36;--tile-edge:#3A4652;--tile-base:#0B0F13;
  --code-dim:#6E7C89;--code-n:#4C5864;--code-run:#222C37;--th-bg:#202831;--panel:#1F272F;--on-ink:#11161B;
  --tick:#34404B;--tick-hi:#2D3B6C;--tick-lo:#5A2A31;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--table);color:var(--ink);font:16px/1.5 var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px 8px}
header h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
header .arr{font-family:var(--mono);font-size:14px;color:var(--muted)}
.ctl{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:14px;cursor:pointer}
.ctl button:hover{border-color:var(--ink)}
.ctl .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ctl .seg button{border:0;border-radius:0}
.ctl .seg button.on,.ctl button.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.ctl button.play.on{background:var(--new);border-color:var(--new);color:#1E2A36}
.ctl .zv{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:40px;text-align:center}

/* timeline */
.tl{display:flex;align-items:flex-end;gap:10px;padding:4px 20px 12px;overflow-x:auto}
.tg{display:flex;flex-direction:column;align-items:center;gap:4px}
.tg .num{font-family:var(--sans);font-weight:800;font-size:15px;width:28px;height:28px;display:grid;place-items:center;background:var(--tile);border:1px solid var(--tile-edge);border-radius:6px;box-shadow:0 3px 0 var(--tile-base)}
.tg .num.txt{width:auto;padding:0 8px;font-size:13px;font-weight:600}
.tg.cur .num{border-color:var(--ink)}
.ticks{display:flex;gap:3px}
.tick{width:30px;height:8px;border-radius:4px;border:0;padding:0;cursor:pointer;background:var(--tick)}
.tick.big{background:var(--tick-hi)}.tick.small{background:var(--tick-lo)}
.tick.done.big{background:var(--hi)}.tick.done.small{background:var(--lo)}.tick.done.plain{background:var(--ink)}
.tick.at{outline:2px solid var(--ink);outline-offset:2px}

/* main grid */
main{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:18px;padding:0 20px 24px;align-items:start}
@media (max-width:920px){main{grid-template-columns:1fr}.stage{order:-1}.code{position:static}}

/* code */
.code{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-family:var(--mono);font-size:12.5px;line-height:1.75;overflow-x:auto;position:sticky;top:12px}
.ln{display:flex;align-items:center;gap:8px;padding:0 12px 0 0;white-space:pre;color:var(--code-dim);border-left:3px solid transparent}
.ln .n{width:30px;text-align:right;flex:none;color:var(--code-n);user-select:none}
.ln.run{color:var(--ink);background:var(--code-run);border-left-color:var(--ink);font-weight:600}
.ln.run.hi{border-left-color:var(--hi)}.ln.run.lo{border-left-color:var(--lo)}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:0 8px;line-height:18px;white-space:nowrap}
.pill.t{background:var(--ink);color:var(--on-ink)}
.pill.n{border:1px solid var(--line);color:var(--muted)}
.pill.f{border:1.5px solid var(--muted);color:var(--muted)}
.pill.v{background:var(--new-pale);color:var(--move);border:1px solid var(--new)}

/* stage */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pic{overflow-x:auto;padding:14px 10px 4px}
.pic svg{display:block;width:calc(var(--z)*100%);min-width:calc(var(--z)*300px);height:auto;margin:0 auto}
.cap{padding:6px 24px 20px;max-width:70ch}
.cap h2{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.015em}
.cap ul{margin:6px 0 0;padding-left:20px}
.cap li{margin:3px 0}
.cap li.note{color:var(--muted)}
.cap .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cap .tag{border-radius:20px;padding:1px 9px;font-weight:700}
.cap .tag.hi{background:var(--hi-pale);color:var(--hi)}.cap .tag.lo{background:var(--lo-pale);color:var(--lo)}.cap .tag.nm{background:var(--code-run);color:var(--ink)}
.cap code{font-family:var(--mono);font-size:.88em;background:var(--code-run);border-radius:4px;padding:0 4px}

/* svg */
svg text{font-family:var(--sans);fill:var(--ink)}
svg .mono{font-family:var(--mono)}
.tile .face{fill:var(--tile);stroke:var(--tile-edge);stroke-width:1.5}
.tile .base{fill:var(--tile-base)}
.tile .ring{fill:none;stroke-width:0}
.tile.read .ring{stroke-width:3}
.tile.read.hi .ring{stroke:var(--hi)}.tile.read.lo .ring{stroke:var(--lo)}.tile.read.nm .ring{stroke:var(--ink)}
.tile.chg .ring{stroke:var(--new);stroke-width:5}
.tile.chg .face{fill:var(--new-pale)}
.slot{cursor:pointer}
.slot:focus{outline:none}
.slot:focus-visible .face{stroke:var(--ink);stroke-width:3;stroke-dasharray:6 4}
.dim{opacity:.3}
.numeral{font-weight:800}
.lab{font-size:12px;fill:var(--muted)}
.rack-hi{fill:var(--hi-pale)}.rack-lo{fill:var(--lo-pale)}
.rt-hi{fill:var(--hi);font-weight:600;font-size:16px}.rt-lo{fill:var(--lo);font-weight:600;font-size:16px}
.op{font-size:26px;font-weight:600;fill:var(--muted)}
.prod-hi{fill:var(--hi);font-weight:800;font-size:30px}.prod-lo{fill:var(--lo);font-weight:800;font-size:30px}
.mv{stroke:var(--move);stroke-width:2.5;fill:none;stroke-linecap:round}
.mvl{fill:var(--move);font-size:13px;font-weight:600}
.mvbg{fill:var(--surface)}
.ah{fill:var(--move)}
.ipill rect{fill:var(--ink)}.ipill text{fill:var(--on-ink);font-weight:700}
.ipill.chg rect{fill:var(--new)}.ipill.chg text{fill:#1E2A36}
.minus{fill:var(--muted)}
.sofar rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.sofar text{font-size:15px;fill:var(--muted)}
.sofar text tspan{fill:var(--ink);font-weight:800}
.sofar.chg rect{fill:var(--new-pale);stroke:var(--new)}
.dry{font-size:15px;fill:var(--muted)}
.result{font-size:34px;font-weight:800;fill:var(--ink)}
.fly{animation:fly .8s cubic-bezier(.25,.8,.3,1) both}
@keyframes fly{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}
.drop{animation:drop .45s ease-in both}
@keyframes drop{to{transform:translateY(40px);opacity:0}}
.pop{animation:pop .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pop,.fly,.drop{transform-box:fill-box;transform-origin:center}
@media (max-width:560px){.ctl .wide-only{display:none}header{padding:12px 16px 6px}.tl{padding:4px 16px 12px}main{padding:0 16px 20px}.cap{padding:6px 16px 18px}.cap h2{font-size:22px}}
@media (prefers-reduced-motion:reduce){.fly,.drop,.pop{animation:none}.drop{opacity:0}}

/* memory view */
.lit{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;padding:6px 4px 10px;align-items:flex-start}
.lit table{border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:14px;min-width:290px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lit caption{text-align:left;font-family:var(--sans);font-weight:700;font-size:16px;padding:0 0 6px}
.lit th{text-align:left;font-size:12px;color:var(--muted);font-weight:400;padding:6px 12px;background:var(--th-bg);border-bottom:1px solid var(--line)}
.lit td{padding:8px 12px;border-bottom:1px solid var(--line)}
.lit tr:last-child td{border-bottom:0}
.lit tr.chg td{background:var(--new-pale)}
.lit tr.chg td:first-child{box-shadow:inset 4px 0 0 var(--new)}
.lit tr.read td{font-weight:700}
.lit tr.read td:first-child{box-shadow:inset 4px 0 0 var(--ink)}
.lit tr.dim td{opacity:.35}
.lit tr.clk{cursor:pointer}
.lit s{color:var(--muted);margin-right:6px}

/* trace */
#detail{margin:0 24px 20px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:none;background:var(--panel)}
#detail.show{display:block}
#detail h3{margin:0 0 6px;font-size:17px}
#detail ol{margin:0;padding-left:22px;font-family:var(--mono);font-size:14px}
#detail li{margin:4px 0}
#detail a{color:var(--hi);cursor:pointer}
#detail .x{float:right;cursor:pointer;color:var(--muted);border:0;background:none;font-size:18px}
.keys{font-size:13px;color:var(--muted);padding:0 20px 20px}
.keys kbd{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
</style></head><body>
<header>
  <h1>Max product difference</h1><span class="arr">nums = [5, 6, 2, 7, 4]</span>
  <div class="ctl" id="ctl"></div>
</header>
<nav class="tl" id="tl" aria-label="steps"></nav>
<main>
  <div class="code" id="code" aria-label="code"></div>
  <section class="stage">
    <div class="pic" id="pic"></div>
    <div class="cap" id="cap"></div>
    <div id="detail"></div>
  </section>
</main>
<p class="keys"><kbd>←</kbd> <kbd>→</kbd> step &nbsp; <kbd>v</kbd> tiles / memory &nbsp; <kbd>r</kbd> replay &nbsp; <kbd>space</kbd> autoplay &nbsp; <kbd>t</kbd> light / dark &nbsp; <kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd> zoom &nbsp; Click a tile in a rack to see where its value came from.</p>
<script>
const NUMS=[5,6,2,7,4];
const V=['big1','big2','small1','small2'];
const SIDE={big1:'hi',big2:'hi',small1:'lo',small2:'lo'};
const CODE=["int maxProductDifference(int* nums, int numsSize) {","  int big1 = 0;","  int big2 = 0;","  int small1 = 10001;","  int small2 = 10001;","","  for (int i = 0; i < numsSize; i++) {","    if (nums[i] > big1) {","      big2 = big1;","      big1 = nums[i];","    } else if (nums[i] > big2) {","      big2 = nums[i];","    }","","    if (nums[i] < small1) {","      small2 = small1;","      small1 = nums[i];","    } else if (nums[i] < small2) {","      small2 = nums[i];","    }","  }","","  return big1 * big2 - small1 * small2;","}"];
const MOVE_LINE={'big1>big2':9,'x>big1':10,'x>big2':12,'small1>small2':16,'x>small1':17,'x>small2':19};
const LINES={init:[2,3,4,5],b1:[7,8,9,10],b2:[7,8,11,12],bn:[7,8,11],s1:[15,16,17],s2:[15,18,19],sn:[15,18],ret:[23]};

/* ---------- pages, produced by running the algorithm ---------- */
const P=[];
let st={big1:'?',big2:'?',small1:'?',small2:'?',i:'—'},prev;
prev=st;st={...st,big1:0,big2:0,small1:10001,small2:10001};
P.push({kind:'init',prev,st,checks:[],moves:V.map(v=>['init',v]),br:'init'});
NUMS.forEach((x,i)=>{
  prev=st;st={...st,i};
  let checks,moves=[],br;
  if(x>st.big1){checks=[[x,'>','big1',st.big1,true]];moves=[['big1','big2'],['x','big1']];st={...st,big2:st.big1,big1:x};br='b1'}
  else if(x>st.big2){checks=[[x,'>','big1',st.big1,false],[x,'>','big2',st.big2,true]];moves=[['x','big2']];st={...st,big2:x};br='b2'}
  else{checks=[[x,'>','big1',st.big1,false],[x,'>','big2',st.big2,false]];br='bn'}
  P.push({kind:'big',i,x,prev,st,checks,moves,br});
  prev=st;moves=[];
  if(x<st.small1){checks=[[x,'<','small1',st.small1,true]];moves=[['small1','small2'],['x','small1']];st={...st,small2:st.small1,small1:x};br='s1'}
  else if(x<st.small2){checks=[[x,'<','small1',st.small1,false],[x,'<','small2',st.small2,true]];moves=[['x','small2']];st={...st,small2:x};br='s2'}
  else{checks=[[x,'<','small1',st.small1,false],[x,'<','small2',st.small2,false]];br='sn'}
  P.push({kind:'small',i,x,prev,st,checks,moves,br});
});
P.push({kind:'ret',prev:st,st,checks:[],moves:[],br:'ret'});

/* ---------- derived ---------- */
const changed=p=>new Set([...['big1','big2','small1','small2','i'].filter(k=>p.prev[k]!==p.st[k]),...p.moves.map(m=>m[1])]);
function read(p){const r=new Set();p.checks.forEach(c=>r.add(c[2]));p.moves.forEach(m=>{if(V.includes(m[0]))r.add(m[0])});if(p.kind==='ret')V.forEach(v=>r.add(v));return r}
const ans=s=>s.big1*s.big2-s.small1*s.small2;
const ready=s=>typeof s.big1==='number'&&s.big2>0&&s.small2<10001;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- words ---------- */
function words(p){
  const q=p.prev,s=p.st,x=p.x;
  const T={
    init:['Start with values that always lose',
      [`<b>big1</b> and <b>big2</b> start at <b>0</b>: every number beats 0 in a <code>&gt;</code> check.`,
       `<b>small1</b> and <b>small2</b> start at <b>10001</b>: every number beats 10001 in a <code>&lt;</code> check.`],
      'Values are always 1 to 10⁴, so these placeholders lose to the first real number.'],
    b1:[`${x} takes the top spot`,
      [`<b>${x} &gt; big1 (${q.big1})</b> → true.`,`Old big1 <b>${q.big1}</b> is copied down into big2.`,`Then <b>${x}</b> is written into big1.`],
      'Copy down first, then write. The other way round, the old big1 is lost.'],
    b2:[`${x} takes second place`,
      [`${x} &gt; big1 (${q.big1}) → false.`,`<b>${x} &gt; big2 (${q.big2})</b> → true, so <b>${x}</b> is written into big2.`],
      'Only one line runs. big1 stays as it is.'],
    bn:[`${x} is too small for the top two`,
      [`${x} &gt; big1 (${q.big1}) → false.`,`${x} &gt; big2 (${q.big2}) → false.`,`<b>Nothing changes.</b>`],
      'Both checks fail, so the if / else-if chain skips this number.'],
    s1:[`${x} is the new smallest`,
      [`<b>${x} &lt; small1 (${q.small1})</b> → true.`,`Old small1 <b>${q.small1}</b> is copied down into small2.`,`Then <b>${x}</b> is written into small1.`],
      'The same shifting as the big side, with < instead of >.'],
    s2:[`${x} becomes second-smallest`,
      [`${x} &lt; small1 (${q.small1}) → false.`,`<b>${x} &lt; small2 (${q.small2})</b> → true, so <b>${x}</b> is written into small2.`],
      'Only one line runs. small1 stays as it is.'],
    sn:[`${x} is too big for the bottom two`,
      [`${x} &lt; small1 (${q.small1}) → false.`,`${x} &lt; small2 (${q.small2}) → false.`,`<b>Nothing changes.</b>`],
      'Both checks fail, so the if / else-if chain skips this number.'],
    ret:['Multiply each pair, then subtract',
      [`Highest two: <b>${s.big1} × ${s.big2} = ${s.big1*s.big2}</b>.`,`Lowest two: <b>${s.small1} × ${s.small2} = ${s.small1*s.small2}</b>.`,`Answer: <b>${s.big1*s.big2} − ${s.small1*s.small2} = ${ans(s)}</b>, the same as Example 1.`],
      'One pass over the array: O(n) time, O(1) extra space.']
  };
  const [title,pts,note]=T[p.br];return {title,pts,note};
}
function dryLine(p){
  if(p.kind==='init')return 'Write 0 into big1 and big2, 10001 into small1 and small2.';
  if(p.kind==='ret')return '';
  const parts=p.moves.map(m=>m[0]==='x'?`copy nums[${p.i}] (${p.x}) into ${m[1]}`:`copy ${m[0]} (${p.prev[m[0]]}) into ${m[1]}`);
  return parts.length?parts.join(', then ')+'.':'No writes on this step.';
}

/* ---------- code column ---------- */
function codeHtml(p){
  const run=new Set(LINES[p.br]),ann={},sd=p.kind==='big'?' hi':p.kind==='small'?' lo':'';
  const pill=(c)=>`<span class="pill ${c[4]?'t':'f'}">${c[0]} ${esc(c[1])} ${c[3]} · ${c[4]?'true':'false'}</span>`;
  if(p.kind==='big'){ann[7]=`<span class="pill v">i = ${p.i}</span>`;ann[8]=pill(p.checks[0]);if(p.checks[1])ann[11]=pill(p.checks[1])}
  if(p.kind==='small'){ann[7]=`<span class="pill n">i = ${p.i}</span>`;ann[15]=pill(p.checks[0]);if(p.checks[1])ann[18]=pill(p.checks[1])}
  if(p.kind==='init')V.forEach((v,j)=>ann[j+2]=`<span class="pill v">${v} = ${p.st[v]}</span>`);
  p.moves.forEach(m=>{const n=MOVE_LINE[m[0]+'>'+m[1]];if(n)ann[n]=`<span class="pill v">${m[1]} ← ${m[0]==='x'?p.x:p.prev[m[0]]}</span>`});
  if(p.kind==='ret')ann[23]=`<span class="pill v">= ${ans(p.st)}</span>`;
  return CODE.map((t,k)=>{const n=k+1;return `<div class="ln${run.has(n)?' run'+sd:''}"><span class="n">${n}</span><span>${esc(t)||' '}</span>${ann[n]||''}</div>`}).join('');
}

/* ---------- tiles view (SVG) ---------- */
const TW=80,TH=96;
const LAY={
  wide:{W:900,H:488,minus:[450,322],nx0:201,racks:{hi:[60,236],lo:[470,236]},SLOT:{big1:{x:86,y:248},big2:{x:226,y:248},small1:{x:496,y:248},small2:{x:636,y:248}}},
  narrow:{W:560,H:704,minus:[280,430],nx0:46,racks:{hi:[20,236],lo:[20,446]},SLOT:{big1:{x:56,y:248},big2:{x:210,y:248},small1:{x:56,y:458},small2:{x:210,y:458}}}
};
function tile(x,y,cls,side,extra,inner){
  return `<g class="tile ${cls} ${side}" ${extra||''}><rect class="base" x="${x}" y="${y+6}" width="${TW}" height="${TH}" rx="12"/>`+
    `<rect class="face" x="${x}" y="${y}" width="${TW}" height="${TH}" rx="12"/><rect class="ring" x="${x}" y="${y}" width="${TW}" height="${TH}" rx="12"/>`+inner+`</g>`;
}
function numText(x,y,val,side,cls,style){
  const n=String(val).length,fs=n>3?26:n>2?34:44;
  return `<text x="${x+TW/2}" y="${y+TH/2+fs*0.36}" text-anchor="middle" class="numeral ${cls||''}" style="font-size:${fs}px;fill:var(--${side});${style||''}">${val}</text>`;
}
function svgTiles(p,mode){
  const L=LAY[mode||'wide'],W=L.W,H=L.H,SLOT=L.SLOT,NX=k=>L.nx0+k*104;
  const ch=changed(p),rd=read(p),focus=ch.size+rd.size>0,loop=p.kind==='big'||p.kind==='small';
  const delay=k=>(0.1+k*0.9).toFixed(2);
  let s=`<svg class="${mode||'wide'}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tiles: nums array and the two racks">`;
  s+=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>`;
  if(mode!=='narrow')s+=`<text x="${NX(0)-18}" y="98" text-anchor="end" class="mono" style="font-size:18px;font-weight:700">nums</text>`;
  NUMS.forEach((v,k)=>{
    const act=loop&&p.i===k;
    s+=`<g class="${act?'':(focus?'dim':'')}"><text x="${NX(k)+TW/2}" y="40" text-anchor="middle" class="lab mono">nums[${k}]</text>`+
      tile(NX(k),48,act?'read':'','nm','',numText(NX(k),48,v,'ink'))+`<text x="${NX(k)+TW/2}" y="172" text-anchor="middle" class="lab mono">0x${(0x100+4*k).toString(16)}</text></g>`;
  });
  if(loop){
    const cx=NX(p.i)+TW/2;
    s+=`<g class="ipill${ch.has('i')?' chg':''}"><rect x="${cx-32}" y="180" width="64" height="24" rx="12"/><text x="${cx}" y="197" text-anchor="middle" class="mono" style="font-size:13px">i = ${p.i}</text></g>`;
  }
  [['hi','highest two',['big1','big2']],['lo','lowest two',['small1','small2']]].forEach(([sd,t,vs])=>{
    const [rx,ry]=L.racks[sd],a=SLOT[vs[0]],b=SLOT[vs[1]];
    const on=vs.some(v=>ch.has(v)||rd.has(v))||!focus;
    s+=`<g class="${on?'':'dim'}"><rect class="rack-${sd}" x="${rx}" y="${ry}" width="${mode==='narrow'?520:370}" height="150" rx="18"/>`+
       `<text x="${(a.x+TW+b.x)/2}" y="${a.y+TH/2+9}" text-anchor="middle" class="op">×</text>`+
       `<text x="${b.x+TW+18}" y="${a.y+TH/2+4}" class="prod-${sd}">= ${p.st[vs[0]]*p.st[vs[1]]}</text>`+
       `<text x="${b.x+TW+20}" y="${a.y+TH/2+30}" class="rt-${sd}">${t}</text></g>`;
  });
  s+=`<rect x="${L.minus[0]-11}" y="${L.minus[1]-12}" width="22" height="4" rx="2" class="minus${focus&&p.kind!=='ret'?' dim':''}"/>`;
  V.forEach(v=>{
    const b=SLOT[v],sd=SIDE[v],cls=ch.has(v)?'chg':rd.has(v)?'read':(focus?'dim':'');
    const mi=p.moves.findIndex(m=>m[1]===v);
    let inner;
    if(mi<0)inner=numText(b.x,b.y,p.st[v],sd);
    else{
      const m=p.moves[mi],d=delay(mi);
      if(m[0]==='init')inner=numText(b.x,b.y,p.st[v],sd,'pop',`animation-delay:${(0.1+V.indexOf(v)*0.2).toFixed(2)}s`);
      else{
        const sx=m[0]==='x'?NX(p.i):SLOT[m[0]].x,sy=m[0]==='x'?48:SLOT[m[0]].y;
        inner=numText(b.x,b.y,p.prev[v],sd,'drop',`animation-delay:${d}s`)+
          `<g class="fly" style="--dx:${sx-b.x}px;--dy:${sy-b.y}px;animation-delay:${d}s"><rect x="${b.x}" y="${b.y}" width="${TW}" height="${TH}" rx="12" style="fill:var(--tile);stroke:var(--new);stroke-width:3"/>`+numText(b.x,b.y,p.st[v],sd)+`</g>`;
      }
    }
    s+=tile(b.x,b.y,'slot '+cls,sd,`data-var="${v}" tabindex="0" role="button" aria-label="${v} = ${p.st[v]}, show where it came from"`,inner);
    s+=`<text x="${b.x+TW/2}" y="${b.y+TH+28}" text-anchor="middle" class="mono${cls==='dim'?' dim':''}" style="font-size:13px;font-weight:600;fill:var(--${sd})">${v}</text>`;
  });
  p.moves.forEach(m=>{
    if(m[0]==='init')return;
    const t=SLOT[m[1]];
    if(m[0]==='x'){
      const x1=NX(p.i)+TW/2,y1=208,x2=t.x+TW/2,y2=t.y-8,lab=`nums[${p.i}] → ${m[1]}`,lw=lab.length*7.6+14;
      let lx,ly;
      if(mode==='narrow'&&SIDE[m[1]]==='lo'){
        // go round the left edge so the arrow never crosses the other rack
        const ym=t.y+TH/2;
        s+=`<path class="mv" d="M${x1},${y1} V${y1+8} Q${x1},${y1+18} ${x1-10},${y1+18} H18 Q8,${y1+18} 8,${y1+28} V${ym-10} Q8,${ym} 18,${ym} H${t.x-8}" marker-end="url(#ah)"/>`;
        lx=Math.min(x1+12,W-lw-6);ly=y1-4;
      }else{
        s+=`<path class="mv" d="M${x1},${y1} C${x1},${y1+30} ${x2},${y2-40} ${x2},${y2}" marker-end="url(#ah)"/>`;
        lx=Math.min(Math.max((x1+x2)/2-lw/2,6),W-lw-6);ly=(y1+y2)/2-11;
        if(Math.abs(x1-x2)<lw)lx=Math.min(Math.max(x1+14,6),W-lw-6);
      }
      s+=`<rect class="mvbg" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" width="${lw.toFixed(1)}" height="20" rx="10"/><text x="${(lx+lw/2).toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="middle" class="mvl mono" style="font-size:12px">${lab}</text>`;
    }else{
      const f=SLOT[m[0]],x1=f.x+TW/2+26,x2=t.x+TW/2-26,y0=f.y+TH+10;
      s+=`<path class="mv" d="M${x1},${y0} Q${(x1+x2)/2},${y0+52} ${x2},${y0}" marker-end="url(#ah)"/>`;
      s+=`<text x="${(x1+x2)/2}" y="${y0+46}" text-anchor="middle" class="mvl">copy down</text>`;
    }
  });
  if(p.kind==='ret')s+=`<text x="${W/2}" y="${H-24}" text-anchor="middle" class="result">${p.st.big1*p.st.big2} − ${p.st.small1*p.st.small2} = ${ans(p.st)}</text>`;
  else{
    s+=`<text x="${W/2}" y="${H-52}" text-anchor="middle" class="dry">${esc(dryLine(p))}</text>`;
    const ok=ready(p.st),hot=ok&&(!ready(p.prev)||ans(p.prev)!==ans(p.st));
    const k=ok?'if the array ended here: ':'difference so far: ',v=ok?`${p.st.big1*p.st.big2} − ${p.st.small1*p.st.small2} = ${ans(p.st)}`:'needs two numbers on each side';
    const w=k.length*7.4+v.length*8.4+32;
    s+=`<g class="sofar${hot?' chg':''}"><rect x="${(W/2-w/2).toFixed(1)}" y="${H-36}" width="${w.toFixed(1)}" height="30" rx="15"/><text x="${W/2}" y="${H-16}" text-anchor="middle">${k}<tspan class="${ok?'mono':''}">${v}</tspan></text></g>`;
  }
  return s+'</svg>';
}

/* ---------- memory view ---------- */
const ADDR={nums:'0x7ffd0020',numsSize:'0x7ffd0028',big1:'0x7ffd002c',big2:'0x7ffd0030',small1:'0x7ffd0034',small2:'0x7ffd0038',i:'0x7ffd003c'};
function litView(p){
  const ch=changed(p),rd=read(p),focus=ch.size+rd.size>0,loop=p.kind==='big'||p.kind==='small';
  let h=`<div class="lit"><table><caption>Heap: the array</caption><tr><th>address</th><th>name</th><th>value</th></tr>`;
  NUMS.forEach((v,k)=>{const act=loop&&p.i===k;h+=`<tr class="${act?'read':(focus?'dim':'')}"><td>0x${(0x100+4*k).toString(16)}</td><td>nums[${k}]</td><td>${v}</td></tr>`});
  h+=`</table><table><caption>Stack: maxProductDifference</caption><tr><th>address</th><th>name</th><th>value</th></tr>`;
  [['nums','0x100'],['numsSize',NUMS.length]].forEach(([n,v])=>{h+=`<tr class="${focus?'dim':''}"><td>${ADDR[n]}</td><td>${n}</td><td>${v}</td></tr>`});
  ['big1','big2','small1','small2','i'].forEach(n=>{
    const c=ch.has(n),r=rd.has(n)||(n==='i'&&loop),cls=c?'chg':r?'read':(focus?'dim':'');
    const val=c&&p.prev[n]!==p.st[n]?`<s>${p.prev[n]}</s>${p.st[n]}`:p.st[n];
    h+=`<tr class="${cls}${V.includes(n)?' clk':''}" data-var="${V.includes(n)?n:''}"><td>${ADDR[n]}</td><td>${n}</td><td>${val}</td></tr>`;
  });
  return h+`</table></div>`;
}

/* ---------- where did this value come from ---------- */
function trace(v,at){
  const out=[];let q=at,g=0;
  while(g++<40){
    let r=q;while(r>=0&&!changed(P[r]).has(v))r--;
    if(r<0)break;
    const m=P[r].moves.find(m=>m[1]===v);if(!m)break;
    if(m[0]==='init'){out.push([r,`${v} starts at ${P[r].st[v]}`]);break}
    if(m[0]==='x'){out.push([r,`${v} = nums[${P[r].i}] = ${P[r].x}`]);break}
    out.push([r,`${v} = old ${m[0]} (${P[r].prev[m[0]]}), copied down`]);v=m[0];q=r-1;
  }
  return out;
}

/* ---------- timeline + controls ---------- */
function tlHtml(cur){
  const tk=(k,cls,label)=>`<button class="tick ${cls}${k<=cur?' done':''}${k===cur?' at':''}" data-go="${k}" aria-label="step ${k+1}: ${label}"></button>`;
  let h=`<div class="tg${cur===0?' cur':''}"><span class="num txt">start</span><div class="ticks">${tk(0,'plain','starting values')}</div></div>`;
  NUMS.forEach((x,i)=>{const a=1+2*i;h+=`<div class="tg${cur===a||cur===a+1?' cur':''}"><span class="num">${x}</span><div class="ticks">${tk(a,'big',`big check for ${x}`)}${tk(a+1,'small',`small check for ${x}`)}</div></div>`});
  const L=P.length-1;
  return h+`<div class="tg${cur===L?' cur':''}"><span class="num txt">return</span><div class="ticks">${tk(L,'plain','return')}</div></div>`;
}
function ctlHtml(view,z,cur){
  return `<button data-a="prev" aria-label="previous step">‹ Back</button><button data-a="next" class="pri" aria-label="next step">Next ›</button>`+
    `<button data-a="play" class="play${S.timer?' on':''}" aria-label="${S.timer?'pause':'autoplay'}" title="Autoplay (space)">${S.timer?'❚❚ Pause':'▶ Play'}</button>`+
    `<div class="seg"><button data-a="tiles" class="${view==='tiles'?'on':''}">Tiles</button><button data-a="mem" class="${view==='mem'?'on':''}">Memory</button></div>`+
    `<button data-a="replay" title="Replay animation (r)">Replay</button><button data-a="zo" class="wide-only" aria-label="zoom out">−</button><span class="zv wide-only">${Math.round(z*100)}%</span><button data-a="zi" class="wide-only" aria-label="zoom in">+</button>`+
    `<button data-a="theme" aria-label="switch light or dark" title="Light / dark (t)"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" style="display:block"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>`;
}
function capHtml(p,k){
  const w=words(p);
  const tag=p.kind==='big'?`<span class="tag hi">big check · nums[${p.i}] = ${p.x}</span>`:p.kind==='small'?`<span class="tag lo">small check · nums[${p.i}] = ${p.x}</span>`:`<span class="tag nm">${p.kind==='init'?'setup':'result'}</span>`;
  return `<p class="eyebrow">step ${k+1} of ${P.length}${tag}</p><h2>${w.title}</h2><ul>${w.pts.map(t=>`<li>${t}</li>`).join('')}<li class="note">${w.note}</li></ul>`;
}

/* ---------- app ---------- */
const S={cur:0,view:'tiles',z:1,timer:null,theme:null};
try{const sv=JSON.parse(localStorage.getItem('mpd-tiles')||'{}');if(sv.view==='tiles'||sv.view==='mem')S.view=sv.view;if(sv.theme==='light'||sv.theme==='dark')S.theme=sv.theme}catch(e){}
const save=()=>{try{localStorage.setItem('mpd-tiles',JSON.stringify({view:S.view,theme:S.theme}))}catch(e){}};
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
function toggleTheme(){const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dark?'light':'dark';applyTheme();save()}
function stop(){clearInterval(S.timer);S.timer=null}
function togglePlay(){
  if(S.timer){stop();render();return}
  if(S.cur>=P.length-1)S.cur=-1;
  S.timer=setInterval(()=>go(S.cur+1),2600);
  go(S.cur+1);
}
const $=id=>document.getElementById(id);
function drawPic(){const p=P[S.cur],el=$('pic');el.innerHTML=S.view==='tiles'?svgTiles(p,el.clientWidth<640?'narrow':'wide'):litView(p)}
let rz;if(typeof window!=='undefined')window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==='tiles')drawPic()},200)});
function render(){
  const y=window.scrollY,p=P[S.cur];
  $('ctl').innerHTML=ctlHtml(S.view,S.z,S.cur);
  $('tl').innerHTML=tlHtml(S.cur);
  $('code').innerHTML=codeHtml(p);
  $('cap').innerHTML=capHtml(p,S.cur);
  drawPic();hideDetail();
  window.scrollTo(0,y);
}
function go(k){S.cur=Math.max(0,Math.min(P.length-1,k));if(S.timer&&S.cur===P.length-1)stop();render()}
function setZ(z){S.z=Math.max(.6,Math.min(4,Math.round(z*10)/10));document.documentElement.style.setProperty('--z',S.z);const e=document.querySelector('.zv');if(e)e.textContent=Math.round(S.z*100)+'%'}
function setView(v){S.view=v;save();render()}
function hideDetail(){const d=$('detail');d.className='';d.innerHTML=''}
function showTrace(v){
  const t=trace(v,S.cur),d=$('detail');
  d.innerHTML=`<button class="x" aria-label="close">✕</button><h3>Where did ${v} = ${P[S.cur].st[v]} come from?</h3><ol>`+
    t.map(([r,txt])=>`<li>${txt} · <a data-go="${r}">step ${r+1}</a></li>`).join('')+`</ol>`;
  d.className='show';
}
if(typeof document!=='undefined'&&$('pic')){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');
    if(b){const a=b.dataset.a;
      if(a==='prev'){stop();go(S.cur-1)}else if(a==='next')go(S.cur+1);
      else if(a==='play')togglePlay();else if(a==='theme')toggleTheme();
      else if(a==='tiles'||a==='mem')setView(a);
      else if(a==='replay')drawPic();
      else if(a==='zi')setZ(S.z+.2);else if(a==='zo')setZ(S.z-.2);
      return}
    const g=e.target.closest('[data-go]');if(g){stop();go(+g.dataset.go);return}
    if(e.target.closest('#detail .x')){hideDetail();return}
    const v=e.target.closest('[data-var]');if(v&&v.dataset.var)showTrace(v.dataset.var);
  });
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    const k=e.key;
    if((k==='Enter'||k===' ')&&e.target.dataset&&e.target.dataset.var){showTrace(e.target.dataset.var);e.preventDefault();return}
    if(k==='ArrowRight')go(S.cur+1);else if(k==='ArrowLeft'){stop();go(S.cur-1)}
    else if(k==='Home'){stop();go(0)}else if(k==='End'){stop();go(P.length-1)}
    else if(k===' '&&!(e.target.closest&&e.target.closest('button')))togglePlay();
    else if(k==='t')toggleTheme();
    else if(k==='Escape')hideDetail();
    else if(k==='v')setView(S.view==='tiles'?'mem':'tiles');
    else if(k==='r')drawPic();
    else if(k==='+'||k==='=')setZ(S.z+.2);else if(k==='-')setZ(S.z-.2);else if(k==='0')setZ(1);
    else return;
    e.preventDefault();
  });
  applyTheme();
  render();
}
</script></body></html>
